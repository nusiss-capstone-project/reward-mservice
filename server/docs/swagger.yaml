definitions:
  data.ApplicationDetailItemVO:
    properties:
      amount:
        type: string
      pay_address:
        type: string
      unit:
        type: string
    required:
    - amount
    - pay_address
    - unit
    type: object
  data.ApproveFinanceDocRequest:
    properties:
      remark:
        type: string
      status:
        enum:
        - APPROVED
        - REJECTED
        type: string
    required:
    - status
    type: object
  data.BaseResponse:
    properties:
      code:
        type: integer
      data: {}
      err_msg:
        type: string
    type: object
  data.CreateFinanceDocRequest:
    properties:
      application_detail:
        items:
          $ref: '#/definitions/data.ApplicationDetailItemVO'
        minItems: 1
        type: array
      creator:
        type: string
      description:
        type: string
      project_id:
        type: integer
    required:
    - application_detail
    - project_id
    type: object
  data.CreateFinanceDocResponse:
    properties:
      doc_id:
        type: string
    type: object
  data.CreateProjectRequest:
    properties:
      description:
        type: string
      name:
        type: string
    required:
    - name
    type: object
  data.CreateProjectResponse:
    properties:
      project_id:
        type: integer
    type: object
  data.FinanceDocVO:
    properties:
      application_detail:
        items:
          $ref: '#/definitions/data.ApplicationDetailItemVO'
        type: array
      created_at:
        type: string
      creator:
        type: string
      description:
        type: string
      doc_id:
        type: string
      project:
        $ref: '#/definitions/data.ProjectVO'
      project_id:
        type: integer
      remark:
        type: string
      status:
        type: string
      updated_at:
        type: string
    type: object
  data.ItemVO:
    properties:
      id:
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  data.PageResult:
    properties:
      items: {}
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
    type: object
  data.PaymentConfigVO:
    properties:
      pay_address:
        type: string
      payment_account:
        type: string
      voucher_type:
        type: string
    type: object
  data.ProjectVO:
    properties:
      description:
        type: string
      id:
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  data.SubmitFinanceDocRequest:
    properties:
      remark:
        type: string
    type: object
  data.UpdateFinanceDocResponse:
    properties:
      doc_id:
        type: string
      remark:
        type: string
      status:
        type: string
    type: object
info:
  contact: {}
paths:
  /reward-ms/v1/admin/finance-docs:
    get:
      description: List finance docs for admin users.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.PageResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: List finance docs
      tags:
      - Admin-FinanceDoc
    post:
      consumes:
      - application/json
      description: Create a finance doc for budget application.
      parameters:
      - description: Finance doc payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.CreateFinanceDocRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.CreateFinanceDocResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: Create finance doc
      tags:
      - Admin-FinanceDoc
  /reward-ms/v1/admin/finance-docs/{doc_id}:
    get:
      description: Get finance doc detail by doc_id.
      parameters:
      - description: Finance doc ID
        in: path
        name: doc_id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.FinanceDocVO'
              type: object
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: Get finance doc detail
      tags:
      - Admin-FinanceDoc
  /reward-ms/v1/admin/finance-docs/{doc_id}/approval:
    patch:
      consumes:
      - application/json
      description: Move finance doc from TO_APPROVE to APPROVED or REJECTED. When
        approved, a Kafka event is published to initialize project budget.
      parameters:
      - description: Finance doc ID
        in: path
        name: doc_id
        required: true
        type: string
      - description: Approval payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.ApproveFinanceDocRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.UpdateFinanceDocResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: Approve or reject finance doc
      tags:
      - Admin-FinanceDoc
  /reward-ms/v1/admin/finance-docs/{doc_id}/submission:
    patch:
      consumes:
      - application/json
      description: Move finance doc from DRAFT or REJECTED to TO_APPROVE.
      parameters:
      - description: Finance doc ID
        in: path
        name: doc_id
        required: true
        type: string
      - description: Submit payload
        in: body
        name: body
        schema:
          $ref: '#/definitions/data.SubmitFinanceDocRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.UpdateFinanceDocResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.BaseResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/data.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: Submit finance doc for approval
      tags:
      - Admin-FinanceDoc
  /reward-ms/v1/admin/payment-configs:
    get:
      description: List payment address and account options for finance doc creation.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/data.PaymentConfigVO'
                  type: array
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: List payment configs
      tags:
      - Admin-PaymentConfig
  /reward-ms/v1/admin/projects:
    get:
      description: List reward projects with page and size.
      parameters:
      - default: 1
        description: Page number
        in: query
        name: page
        type: integer
      - default: 20
        description: Page size
        in: query
        name: size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.PageResult'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: List projects
      tags:
      - Admin-Project
    post:
      consumes:
      - application/json
      description: Create a reward project.
      parameters:
      - description: Project payload
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/data.CreateProjectRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.CreateProjectResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/data.BaseResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/data.BaseResponse'
      summary: Create project
      tags:
      - Admin-Project
  /reward-ms/v1/items:
    post:
      consumes:
      - application/json
      description: Create an item record.
      parameters:
      - description: Item information
        in: body
        name: user
        required: true
        schema:
          $ref: '#/definitions/data.ItemVO'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  $ref: '#/definitions/data.ItemVO'
              type: object
        "400":
          description: Bad Request
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  type: string
              type: object
        "500":
          description: Internal Server Error
          schema:
            allOf:
            - $ref: '#/definitions/data.BaseResponse'
            - properties:
                data:
                  type: string
              type: object
      summary: Item Create
      tags:
      - Item
  /reward-ms/v1/items/{item_id}:
    get:
      description: Get item information by item ID.
      parameters:
      - description: Item.ID
        in: path
        name: item_id
        required: true
        type: integer
      responses:
        "200":
          description: OK
      summary: Item Query with ID
      tags:
      - Item
swagger: "2.0"
